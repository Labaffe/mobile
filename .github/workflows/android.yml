name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest
      - name: Compilation de l'APK debug
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Publie l'APK dans une release « latest » pour pouvoir l'installer
      # directement depuis le téléphone (lien fixe, sans fichier zip).
      - name: Publication de l'APK (release « latest »)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk mobile.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest mobile.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Dernière version (build #$GITHUB_RUN_NUMBER)" \
            --notes "Branche ${GITHUB_REF_NAME} — commit ${GITHUB_SHA::7}"
